# Запуск: cd deploy && cp .env.example .env && docker compose up -d --build
#
# По умолчанию сайт слушает только 127.0.0.1:${APP_PORT} и ждёт, что HTTPS обеспечивает
# уже работающий на сервере прокси (nginx и т.п., пример в deploy/nginx/meet.conf).
# Если порты 80/443 свободны, можно поднять собственный Caddy:
#   docker compose --profile caddy up -d --build
services:
  postgres:
    image: postgres:16-alpine
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: meet
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meet -d meet"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # Ограничения, чтобы звонки не забирали ресурсы у других проектов на сервере.
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEMORY:-1g}
    # Готовый образ (docker load из архива) используется как есть; из исходников: (cd .. && docker build -t vcos-app:latest -f deploy/Dockerfile .)
    image: ${APP_IMAGE:-vcos-app:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meet:${POSTGRES_PASSWORD}@postgres:5432/meet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN:-localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-60}
      # Media: all audio and video go through one UDP port.
      RTC_UDP_PORT: ${RTC_UDP_PORT:-50000}
      RTC_PUBLIC_IP: ${PUBLIC_IP:-}
      TURN_URLS: turn:${DOMAIN:-localhost}:3478?transport=udp,turn:${DOMAIN:-localhost}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    ports:
      # HTTP only on loopback: the reverse proxy on this host terminates TLS.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "${RTC_UDP_PORT:-50000}:${RTC_UDP_PORT:-50000}/udp"

  # TURN relay for participants behind strict NAT or firewalls that block direct UDP.
  coturn:
    image: coturn/coturn:4.6
    cpus: 1
    mem_limit: 256m
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN:-localhost}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Do not relay into private networks.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --external-ip=${PUBLIC_IP:-127.0.0.1}

  caddy:
    image: caddy:2.10-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
