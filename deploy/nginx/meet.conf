# Отдельный сайт для сервиса конференций. Существующие server-блоки не меняются:
# nginx выбирает сайт по имени домена (server_name).
#
# 1. Замените meet.example.com на свой поддомен (A-запись должна указывать на сервер).
# 2. sudo cp meet.conf /etc/nginx/sites-available/zz-meet.conf
#    sudo ln -s /etc/nginx/sites-available/zz-meet.conf /etc/nginx/sites-enabled/
#    (или в /etc/nginx/conf.d/zz-meet.conf, если sites-enabled не используется)
#    Имя zz-... нужно, чтобы этот сайт не стал сайтом по умолчанию для чужих доменов и IP.
# 3. Сертификат: sudo certbot --nginx -d meet.example.com
#    certbot сам допишет ssl_certificate в этот файл.
# 4. sudo nginx -t && sudo systemctl reload nginx

# Заголовок Upgrade превращается в Connection: upgrade только для WebSocket.
map $http_upgrade $meet_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name meet.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Комнаты работают через WebSocket: соединение живёт весь звонок.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meet_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        client_max_body_size 2m;
    }
}
