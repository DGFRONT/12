# Сайт сервиса конференций для nginx, который работает в Docker-контейнере.
# Сервис подключён к сети этого nginx (docker-compose.shared-proxy.yml) под именем meet-app.
#
# Адрес meet-app определяется при каждом запросе через DNS Docker (127.0.0.11), а не при старте
# nginx. Поэтому если сервис конференций остановлен, nginx всё равно запустится, и ваш основной
# проект продолжит работать, а этот поддомен будет отвечать 502.

map $http_upgrade $meet_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name meet.example.com;

    # Для выпуска сертификата через webroot используйте тот же location, что и в ваших сайтах.
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meet.example.com;

    # Пути к сертификату для этого поддомена (как у ваших остальных сайтов)
    ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $meet_upstream http://meet-app:8080;

    location / {
        proxy_pass $meet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meet_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        client_max_body_size 2m;
    }
}
